# macOS overlay for the standard binding set (file naming convention: <set>-macos.properties).
#
# Word-editing is defined only in standard.properties, and the other sets (vim, emacs, ...) inherit
# it, so correcting it here is enough for every set. Add vim-macos.properties etc. only if a set
# ever binds its own word keys that need a different macOS mapping.
#
# This overlay REPLACES each action it names (see BindingSets#loadMacOverlay): the
# line lists the complete macOS binding for that action, so the base's Ctrl keys
# are dropped unless repeated here. macOS word editing uses Option (reported as
# Alt), matching the system text layer; Ctrl+Left/Ctrl+Right there is Mission
# Control, not an editor key, so it is intentionally not bound.
#
# Ctrl+w is kept (listed below) because it is a universal readline control byte
# that works on every terminal.

# Word-wise movement
moveWordLeft = Alt+Left
moveWordRight = Alt+Right

# Word-wise deletion
deleteWordBackward = Alt+Backspace, Ctrl+w
deleteWordForward = Alt+Delete
