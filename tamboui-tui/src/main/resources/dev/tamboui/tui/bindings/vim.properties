# Vim-style bindings
# Extends standard bindings with hjkl navigation
#
# Keypad keys (Keypad_*) are included alongside their main-key equivalents so that
# apps using the Kitty keyboard protocol in FULL mode still get expected
# behaviour out of the box.

# Navigation - add vim style
moveUp = Up, Keypad_Up, k, K
moveDown = Down, Keypad_Down, j, J
moveLeft = Left, Keypad_Left, h, H
moveRight = Right, Keypad_Right, l, L

# Page navigation - vim style
pageUp = PageUp, Keypad_PageUp, Ctrl+u
pageDown = PageDown, Keypad_PageDown, Ctrl+d
home = Home, Keypad_Home, g
end = End, Keypad_End, G

# Editing - add vim 'x' for delete
deleteForward = Delete, Keypad_Delete, x
