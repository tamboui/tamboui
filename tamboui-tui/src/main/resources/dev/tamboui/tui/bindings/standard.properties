# Standard bindings - arrow keys only, safe for text input
# This is the base binding set, no vim or emacs-style bindings
#
# Keypad keys (Keypad_*) are included alongside their main-key equivalents so that
# apps using the Kitty keyboard protocol in FULL mode (where keypad keys are
# reported as distinct code points) still get expected behaviour out of the box.

# Navigation - arrow keys only
moveUp = Up, Keypad_Up
moveDown = Down, Keypad_Down
moveLeft = Left, Keypad_Left
moveRight = Right, Keypad_Right

# Word-wise movement (needs a terminal that reports Ctrl+Arrow, e.g. via the Kitty keyboard protocol)
moveWordLeft = Ctrl+Left
moveWordRight = Ctrl+Right

# Page navigation
pageUp = PageUp, Keypad_PageUp
pageDown = PageDown, Keypad_PageDown
home = Home, Keypad_Home
end = End, Keypad_End

# Selection
select = Enter, Space, Keypad_Enter
confirm = Enter, Keypad_Enter
cancel = Escape

# Focus
focusNext = Tab
focusPrevious = Shift+Tab

# Editing
deleteBackward = Backspace
deleteForward = Delete, Keypad_Delete

# Word-wise deletion. Ctrl+w works on any terminal (a C0 control byte); Ctrl+Backspace/Ctrl+Delete
# need a terminal that reports them, e.g. via the Kitty keyboard protocol.
deleteWordBackward = Ctrl+Backspace, Ctrl+w
deleteWordForward = Ctrl+Delete

# Application
quit = q, Q, Ctrl+c

# Mouse
click = Mouse.Left.Press
rightClick = Mouse.Right.Press
scroll = Mouse.ScrollUp, Mouse.ScrollDown, Mouse.ScrollLeft, Mouse.ScrollRight
scrollUp = Mouse.ScrollUp
scrollDown = Mouse.ScrollDown
scrollLeft = Mouse.ScrollLeft
scrollRight = Mouse.ScrollRight

# Debug / Development
toggleDebugOverlay = Ctrl+Shift+F12
